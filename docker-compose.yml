services:
  db:
    image: postgres:15
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
    volumes:
      - .:/app
      - ml_model_data:/app/ml_model
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
  ml_model_data: